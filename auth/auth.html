<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion / Inscription</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .password-toggle {
            cursor: pointer;
        }
    </style>
</head>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        let isSignup = false;

        // Basculer entre connexion et inscription
        document.getElementById("toggle-link").addEventListener("click", function (e) {
            e.preventDefault();
            isSignup = !isSignup;

            if (isSignup) {
                document.getElementById("form-title").textContent = "Inscription";
                document.getElementById("name-field").classList.remove("d-none");
                document.querySelector("button[type='submit']").textContent = "S'inscrire";
                document.getElementById("toggle-text").innerHTML = "Déjà un compte ? <a href='#' id='toggle-link'>Se connecter</a>";
            } else {
                document.getElementById("form-title").textContent = "Connexion";
                document.getElementById("name-field").classList.add("d-none");
                document.querySelector("button[type='submit']").textContent = "Se connecter";
                document.getElementById("toggle-text").innerHTML = "Pas encore inscrit ? <a href='#' id='toggle-link'>Créer un compte</a>";
            }
        });

        // Afficher / Masquer le mot de passe
        document.querySelector(".password-toggle").addEventListener("click", function () {
            const passwordInput = document.getElementById("password");
            const type = passwordInput.type === "password" ? "text" : "password";
            passwordInput.type = type;
            this.querySelector("i").classList.toggle("bi-eye");
            this.querySelector("i").classList.toggle("bi-eye-slash");
        });

        // Soumettre le formulaire avec fetch
        document.getElementById("auth-form").addEventListener("submit", function (e) {
            e.preventDefault();

            const formData = {
                action: isSignup ? "signup" : "login",
                fullname: document.querySelector("input[name='fullname']").value,
                email: document.querySelector("input[name='email']").value,
                password: document.querySelector("input[name='password']").value
            };

            fetch("./auth.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(formData)
            })
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                    if (data.status === "success" && !isSignup) {
                        window.location.href = "dashboard.html"; // Redirige vers une autre page après connexion
                    }
                })
                .catch(error => {
                    console.error("Erreur :", error);
                    alert("Une erreur est survenue, veuillez réessayer.");
                });
        });
    });
</script>

<body>

<div class="container">
    <div class="form-container">
        <!-- Titre qui change -->
        <h3 id="form-title" class="text-center my-4">Connexion</h3>

        <!-- Formulaire -->
        <form id="auth-form">
            <div id="name-field" class="mb-3 d-none">
                <label class="form-label">Nom complet</label>
                <input type="text" class="form-control" name="fullname" placeholder="Votre nom">
            </div>
            
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" placeholder="exemple@email.com" required>
            </div>
            
            <div class="mb-3 position-relative">
                <label class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="password" name="password" required>
                <span class="password-toggle position-absolute end-0 top-50 me-3"><i class="bi bi-eye-slash"></i></span>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">Se connecter</button>
        </form>

        <div class="text-center mt-3">
            <p id="toggle-text">Pas encore inscrit ? <a href="#" id="toggle-link">Créer un compte</a></p>
        </div>
    </div>
    <a href="../index.html" class="text-center btn btn-outline-secondary p-2">revenir en arriere </a>
</div>

</body>
</html>
